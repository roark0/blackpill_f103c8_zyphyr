# platform_legacy.yaml
platform:
  name: "8051-like"
  architecture: "8-bit"

pin_groups:
  - name: led
    type: gpio_output
    pins:
      LED1: P1.0
      LED2: P1.1
      LED3: P1.2
      LED4: P1.3

  - name: switch
    type: gpio_input
    pins:
      SW1: P2.7
      SW3: P2.6
      SW5: P2.5
      SW7: P2.4

  - name: digit_display_shiwei
    type: gpio_output
    pins:
      SHIWEI_A: P0.4
      SHIWEI_B: P0.7
      SHIWEI_C: P0.6
      SHIWEI_D: P0.5

  - name: digit_display_gewei
    type: gpio_output
    pins:
      GEWEI_A: P0.0
      GEWEI_B: P0.1
      GEWEI_C: P0.2
      GEWEI_D: P0.3

  - name: digit_display_xiaoshuwei
    type: gpio_output
    pins:
      XIAOSHUWEI_A: P2.0
      XIAOSHUWEI_B: P2.1
      XIAOSHUWEI_C: P2.2
      XIAOSHUWEI_D: P2.3

  - name: analog
    type: adc
    pins:
      TEMP: P1.5
      YL:   P3.2

  - name: power_control
    type: gpio_output
    pins:
      POWCL: P1.4