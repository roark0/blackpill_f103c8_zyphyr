# QPC Zephyr application
# SPDX-License-Identifier: GPL-3.0-or-later OR LicenseRef-QL-commercial

# System clock tick for QPC (100 ticks per second = 10ms)
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100

# Enable USART1
CONFIG_SERIAL=y

# Enable GPIO
CONFIG_GPIO=y

# Enable printk for debugging
CONFIG_PRINTK=y
CONFIG_LOG=y

# Enable necessary drivers
CONFIG_GPIO_STM32=y
CONFIG_UART_STM32=y

# Enable floating point support for printf
CONFIG_CBPRINTF_FP_SUPPORT=y

# Enable GPIO interrupt support
CONFIG_GPIO=y

# Enable SEGGER RTT
CONFIG_USE_SEGGER_RTT=y

# RTT Configuration
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=512
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=16
CONFIG_SEGGER_RTT_PRINTF_BUFFER_SIZE=64
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=3
CONFIG_SEGGER_RTT_MAX_NUM_DOWN_BUFFERS=3

# Use blocking mode for terminal output
CONFIG_SEGGER_RTT_MODE_BLOCK_IF_FIFO_FULL=y

# Place RTT data in custom section
CONFIG_SEGGER_RTT_SECTION_CUSTOM=y
CONFIG_SEGGER_RTT_CB_ALIGNMENT=16

# UART Configuration
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_LOG_BACKEND_RTT=y
CONFIG_UART_CONSOLE=n